<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>울산 중구 연락망</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f4e8c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="울산 중구 연락망">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex,nofollow">
<style>
  :root{--font-name:"Batang","바탕","NanumMyeongjo","Noto Serif KR",serif}
  *{box-sizing:border-box}
  html,body{margin:0;background:#eaf0f7;color:#1c2430;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:13px}

  /* 인물 카드 */
  #pc{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;align-items:center;justify-content:center}
  #pc.on{display:flex}
  #pc .card{background:#fff;border-radius:10px;width:340px;padding:18px 20px;box-shadow:0 8px 30px rgba(0,0,0,.25);font-size:13px}
  #pc .ph{width:120px;height:150px;border:1px solid #bbb;border-radius:6px;background:#f2f4f7;display:flex;align-items:center;justify-content:center;color:#889;overflow:hidden;margin:0 auto 10px}
  #pc .ph img{width:100%;height:100%;object-fit:cover}
  #pc .nm{text-align:center;font:700 20px var(--font-name);letter-spacing:3px}
  #pc .pos{text-align:center;color:#556;margin-bottom:10px}
  #pc .row{display:grid;grid-template-columns:70px 1fr;gap:6px 10px;align-items:center;margin:6px 0}
  #pc .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px}
  #pc a{color:#1d4fb8}
  #pc a.call{display:block;text-align:center;padding:9px 10px;border-radius:6px;background:#1d4fb8;color:#fff;font-weight:700;font-size:14px;text-decoration:none}
  #pc a.call:active{background:#153a8a}
  #pc a.call.mail{background:#d9822b}
  #pc a.call.mail:active{background:#b56a1f}
  #pc a.ext{display:inline-block;padding:6px 12px;border:1px solid #1d4fb8;border-radius:6px;font-weight:700;text-decoration:none}
  #pc .val{overflow-wrap:anywhere}
  #pc button{border:1px solid #9aa8b8;background:#f7f9fb;border-radius:4px;padding:7px 12px;cursor:pointer;font-size:12.5px}
  #pc .btns{display:flex;justify-content:center;margin-top:12px}

  /* ── 휴대폰 화면 ───────────────────────────── */
  #m{max-width:640px;margin:0 auto;padding-bottom:48px;color:#1c2a3a;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
  #mhead{position:sticky;top:0;z-index:20;background:#1e3a78;color:#fff;padding:10px 12px 8px;padding-top:max(10px,env(safe-area-inset-top));box-shadow:0 2px 6px rgba(0,0,0,.25)}
  #mhead .mt1{display:flex;align-items:baseline;gap:8px}
  #mtitle{font-size:18px;letter-spacing:.5px}
  #mdate{font-size:11.5px;opacity:.75}
  #mhead button{border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:14px;padding:5px 12px;font-size:12.5px}
  #mq{width:100%;box-sizing:border-box;margin-top:8px;border:0;border-radius:10px;padding:12px 14px;font-size:16px;background:#fff;color:#1c2a3a}
  #mhead .msub{display:flex;align-items:center;margin-top:7px;font-size:12px;min-height:26px}
  #mcnt{opacity:.85}
  #mAll{margin-left:auto}
  .msec{margin:12px 10px 0;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(20,40,70,.14)}
  details.mu{margin:10px 10px 0;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(20,40,70,.14)}
  details.mu>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:15px 14px;font-weight:800;font-size:18px;cursor:pointer;border-left:6px solid #2f6fc4;-webkit-tap-highlight-color:transparent}
  details.mu>summary::-webkit-details-marker{display:none}
  details.mu>summary::after{content:"›";margin-left:auto;font-size:26px;line-height:1;color:#6f87a9;transform:rotate(90deg);transition:transform .15s}
  details.mu[open]>summary::after{transform:rotate(-90deg)}
  details.mu[open]>summary{background:#f1f6fc}
  .mc{font-size:11.5px;font-weight:600;color:#fff;background:#6f87a9;border-radius:10px;padding:2px 9px}
  .mdh{padding:8px 14px;background:#e3ecf7;font-weight:700;font-size:13px;color:#2f4a73;border-top:1px solid #d3dfee}
  details.md{border-top:1px solid #c3d3e8}
  details.md>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:10px 14px 10px 10px;background:#dbe7f5;border-left:6px solid #7fa3c9;font-weight:800;font-size:14.5px;color:#25405c;cursor:pointer;-webkit-tap-highlight-color:transparent}
  details.md>summary::-webkit-details-marker{display:none}
  details.md>summary::after{content:"›";margin-left:auto;font-size:20px;line-height:1;color:#6f87a9;transform:rotate(90deg);transition:transform .15s}
  details.md[open]>summary::after{transform:rotate(-90deg)}
  .mc2{font-size:11px;font-weight:600;color:#2f4a73;background:#fff;border-radius:9px;padding:1px 8px}
  .mrow{display:flex;align-items:center;gap:11px;padding:9px 12px;min-height:58px;border-top:1px solid #e8edf3;background:#fff;cursor:pointer;-webkit-tap-highlight-color:rgba(47,111,196,.15)}
  .mrow:active{background:#eef4fb}
  .mrow.mhd{background:#f7faff;border-top:1px solid #d3dfee}
  .mrow.mhd .mn{font-weight:800}
  .mrow.mtm{padding-left:26px}
  .mav{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#dbe5f1;color:#3a5a86;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none}
  .mtx{flex:1;min-width:0}
  .mn{font-size:17px;font-weight:700}
  .ml{font-size:12.5px;color:#5b6b80;margin-left:7px;font-weight:500}
  .mext{display:block;font-size:12.5px;color:#6b7787;margin-top:1px}
  .mcall{width:40px;height:40px;border-radius:50%;background:#1f9d55;color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;text-decoration:none;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .mcall:active{background:#16793f}
  .mcall.ext{background:#1f5fbf}
  .mcall.ext:active{background:#15458c}
  .mbtns{display:flex;gap:6px;flex:none}
  .mcall.mail{background:#d9822b}
  .mcall.mail:active{background:#b56a1f}
  .mcall.mail.off{background:#e4e9ef;color:#aab4c0}
  .mcall.off,.mcall.ext.off,.mcall.mail.off{background:#e4e9ef;color:#aab4c0;box-shadow:none}
  .mnone{padding:30px 16px;text-align:center;color:#6b7787}
  .mfoot{margin:14px 14px 0;font-size:12.5px;color:#55657a;line-height:1.7;white-space:pre-line}
  .mstat{width:100%;border-collapse:collapse;font-size:12.5px}
  .mstat th,.mstat td{border:1px solid #d3dfee;padding:6px 4px;text-align:center}
  .mstat th{background:#e3ecf7}
  @media (max-width:820px){
    #pc .card{width:min(92vw,400px);max-height:92vh;overflow:auto;box-sizing:border-box}
    #pc a.call{padding:14px 10px;font-size:16px}
  }
  /* 상단 캐릭터: 검색창 옆 상반신 */
  #mhead .mt1{flex-wrap:wrap;padding-right:72px;row-gap:0}
  #mq{width:calc(100% - 78px);margin-top:16px}
  #mhead .msub{margin-top:14px;gap:6px}
  #mAll{white-space:nowrap;flex:none}
  #mgirl{position:absolute;right:10px;top:max(10px,env(safe-area-inset-top));width:68px;height:90px;overflow:hidden;pointer-events:none}
  #mgirl img{display:block;width:68px}
  @media (max-width:380px){ #mq::placeholder{font-size:13.5px} #mcnt{font-size:10.5px} #mAll{padding:5px 9px !important} }
  @media (max-width:340px){ #mq{padding-left:10px;padding-right:6px} #mq::placeholder{font-size:11.5px} }

#mData{margin-left:auto;white-space:nowrap;flex:none}
#mAll{margin-left:0 !important}
#mhead .msub{flex-wrap:wrap}
#imp{margin:14px 10px;padding:16px;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(20,40,70,.14);line-height:1.6}
#imp h2{margin:0 0 8px;font-size:18px}
#imp p{margin:6px 0}
#imp .ibtn{display:inline-block;border:0;background:#1f4e8c;color:#fff;border-radius:10px;padding:11px 18px;font-size:15px;cursor:pointer;margin:8px 8px 0 0}
#imp .ibtn.warn{background:#b3261e}
#imp input[type=password]{display:block;width:100%;box-sizing:border-box;padding:11px;font-size:16px;border:1px solid #b8c4d4;border-radius:8px;margin-top:6px}
#impMsg{margin-top:10px;font-size:14px;color:#1f4e8c}#impMsg.err{color:#b3261e}
#impInfo{margin-top:8px;font-size:12.5px;color:#6b7787}
</style>
</head>

<script>
let D = null;
// 파견·교육 항목: 예전 문자열 형식('행정6급 성낙은')을 {label,name}으로 변환
function normalize(){ if (!D) return; (D.groups||[]).forEach(col => col.forEach(g => { g.items = (g.items||[]).map(it => { if (typeof it !== 'string') return it; const i = it.lastIndexOf(' '); return i > 0 ? {label: it.slice(0,i), name: it.slice(i+1)} : {label:'', name: it}; }); })); }
normalize();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 경로로 값 읽기
function getObj(p){ return p.split('.').reduce((o,k)=>o?.[k], D); }
let pcPath = null;
function pcOpen(path){
  const o = getObj(path); if (!o) return; pcPath = path;
  const ph = document.getElementById('pcPh'); ph.innerHTML = o.photo ? `<img src="${o.photo}">` : '사진 없음';
  document.getElementById('pcNm').textContent = o.name || '';
  document.getElementById('pcPos').textContent = [o.label || o.title || '', o.rank || '', o.duty || ''].filter(Boolean).join(' · ');
  { const t = String(o.tel||'').trim(); const el = document.getElementById('pcTel'); if (/^\d{4}$/.test(t)) el.innerHTML = `<a class="ext" href="tel:052290${t}">☎ 290-${t}</a>`; else el.textContent = o.tel ? '290-' + o.tel : ''; }
  document.getElementById('pcMob').textContent = o.mobile || '';
  document.getElementById('pcMail').textContent = o.email || '';
  pcCallUpdate();
  document.getElementById('pc').classList.add('on');
}
function pcCallUpdate(){ const a = document.getElementById('pcCall'); const d = (document.getElementById('pcMob').textContent || '').replace(/[^0-9+]/g, '');
  if (d.length >= 8) { a.href = 'tel:' + d; a.style.display = 'block'; } else { a.removeAttribute('href'); a.style.display = 'none'; }
  document.getElementById('pcCopy').style.display = d.length >= 8 ? 'block' : 'none';
  const mb = document.getElementById('pcMailBtn'), ev = (document.getElementById('pcMail').textContent || '').trim();
  if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(ev)) { mb.href = 'mailto:' + ev; mb.style.display = 'block'; } else { mb.removeAttribute('href'); mb.style.display = 'none'; } }
document.getElementById('pcCall').addEventListener('click', e => { const h = e.currentTarget.getAttribute('href'); if (!h || h === '#') { e.preventDefault(); return; } e.preventDefault(); window.location.href = h; });
document.getElementById('pcCopy').addEventListener('click', async () => { const v = (document.getElementById('pcMob').textContent || '').trim(); const b = document.getElementById('pcCopy'); let ok = false;
  try { await navigator.clipboard.writeText(v); ok = true; } catch (e) { const t = document.createElement('textarea'); t.value = v; document.body.appendChild(t); t.select(); try { ok = document.execCommand('copy'); } catch (e2) {} t.remove(); }
  b.textContent = ok ? '복사했습니다 — 전화 앱에 붙여넣으세요' : '복사 실패 — 번호를 길게 눌러 복사하세요'; setTimeout(() => b.textContent = '번호 복사 (전화가 안 걸릴 때)', 2500); });
function pcClose(){ document.getElementById('pc').classList.remove('on'); pcPath = null; }
document.getElementById('pc').addEventListener('click', e => { if (e.target.id === 'pc' || e.target.id === 'pcX') pcClose(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && pcPath) pcClose(); });

/* ── 휴대폰 화면: 같은 데이터(D)로 접고 펼치는 목록을 만든다 ── */
const MV = { open: new Set(), mdOpen: new Set(), allOpen: false };
const mdig = v => String(v||'').replace(/[^0-9+]/g,'');
const mhead = l => { l = String(l||'').replace(/\s+/g,''); if (l.endsWith('전당관장')) return l.slice(0,-2); return l.endsWith('장') ? l.slice(0,-1) : l; };
function mPerson(o, path, cls='', labelOv){
  if (!o) return '';
  const label = labelOv ?? (o.label || o.title || o.duty || ''), name = o.name || '';
  const ext = o.tel ? '290-' + o.tel : '', mob = mdig(o.mobile);
  const xd = /^\d{4}$/.test(String(o.tel||'').trim()) ? '052290' + String(o.tel).trim() : '';
  const xcall = xd ? `<a class="mcall ext" href="tel:${xd}" aria-label="${esc(name)} 내선 걸기">☎</a>` : `<span class="mcall ext off">☎</span>`;
  const em = String(o.email||'').trim(), okm = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em);
  const mcall = mob.length >= 8 ? `<a class="mcall" href="tel:${mob}" aria-label="${esc(name)} 휴대전화 걸기">📞</a>` : `<span class="mcall off">📞</span>`;
  const mmail = okm ? `<a class="mcall mail" href="mailto:${esc(em)}" aria-label="${esc(name)} 메일 보내기">✉</a>` : `<span class="mcall mail off">✉</span>`;
  const call = `<div class="mbtns">${xcall}${mcall}${mmail}</div>`;
  const av = o.photo ? `<img class="mav" loading="lazy" src="${o.photo}" alt="">` : `<span class="mav">${esc((name||'·').charAt(0))}</span>`;
  const key = [label, name, o.tel, ext, o.mobile, o.email, o.duty].join('').replace(/[\s-]/g,'');
  return `<div class="mrow ${cls}" data-mp="${path}" data-s="${esc(key)}">${av}<div class="mtx"><span class="mn">${esc(name || '(공석)')}</span><span class="ml">${esc(label)}</span><span class="mext">${ext ? '내선 ' + ext : ''}</span></div>${call}</div>`;
}
function mDept(d, dp, sub){
  let h = '<div class="mdept">';
  if (d.nobox) h += `<div class="mdh">${esc(d.label||'')}</div>`;
  else if (d.twin) { h += `<div class="mdh">${esc(d.label||'전문위원')}</div>` + d.twin.map((w,wi)=>mPerson(w, `${dp}.twin.${wi}`, 'mhd', '전문위원')).join(''); }
  else h += mPerson(d, dp, 'mhd');
  h += (d.teams||[]).map((t,ti)=>mPerson(t, `${dp}.teams.${ti}`, 'mtm')).join('');
  h += '</div>';
  if (!sub) return h;
  /* 국 안에서 과별로 접고 펼 수 있는 구역으로 묶는다 */
  const nm = d.nobox ? (d.label||'') : d.twin ? (d.label||'전문위원') : (mhead(d.label) || '기타');
  const cnt = (d.nobox ? 0 : d.twin ? d.twin.length : 1) + (d.teams||[]).length;
  return `<details class="md" data-k2="${dp}"${MV.mdOpen.has(dp) ? ' open' : ''}><summary><span>${esc(nm)}</span><span class="mc2">${cnt}명</span></summary>${h}</details>`;
}
function mCount(u){ let n = u.bureau ? 1 : 0; u.depts.forEach(d => { if (!d.nobox && !d.twin) n++; n += (d.twin||[]).length + (d.teams||[]).length; }); return n; }
function mDet(key, title, count, inner){
  return `<details class="mu" data-k="${key}"${MV.open.has(key) ? ' open' : ''}><summary><span>${esc(title)}</span><span class="mc">${count}명</span></summary>${inner}</details>`;
}
function renderMobile(){
  const body = document.getElementById('mbody'); if (!body) return;
  if (!D) { document.getElementById('mtitle').textContent = '울산 중구 연락망'; document.getElementById('mdate').textContent = ''; body.innerHTML = ''; document.getElementById('mcnt').textContent = '데이터를 불러오세요'; impShow(true); return; }
  document.getElementById('mtitle').textContent = D.title || '직위표';
  document.getElementById('mdate').textContent = D.date || '';
  let h = (D.head || (D.secretaries||[]).length ? '' : '') + mDet('head', '구청장', 1 + (D.secretaries||[]).length, `<div class="mdept">${mPerson(D.head,'head','mhd')}${(D.secretaries||[]).map((s,i)=>mPerson(s,`secretaries.${i}`)).join('')}</div>`)
    + mDet('deputy', '부구청장', 1 + (D.deputySecs||[]).length, `<div class="mdept">${mPerson(D.deputy,'deputy','mhd')}${(D.deputySecs||[]).map((s,i)=>mPerson(s,`deputySecs.${i}`)).join('')}</div>`);
  D.units.forEach((u,ui)=>{
    const b = u.bureau, title = mhead(b ? b.label : (u.depts[0]||{}).label);
    let inner = b ? `<div class="mdept">${mPerson(b, `units.${ui}.bureau`, 'mhd')}</div>` : '';
    const sub = !!b || u.depts.length > 1;
    inner += u.depts.map((d,di)=>mDept(d, `units.${ui}.depts.${di}`, sub)).join('');
    h += mDet('u'+ui, title, mCount(u), inner);
  });
  let dn = 0, dh = (D.dongs||[]).map((g,gi)=>{ dn += 1 + (g.staff||[]).length; return '<div class="mdept">' + mPerson(g, `dongs.${gi}`, 'mhd') + (g.staff||[]).map((st,si)=>mPerson(st, `dongs.${gi}.staff.${si}`, 'mtm')).join('') + '</div>'; }).join('');
  if ((D.dongs||[]).length) h += mDet('dong', '동 (' + (D.dongs||[]).length + '개 동)', dn, dh);
  let gn = 0, gh = (D.groups||[]).map((col,ci)=>col.map((g,gi)=>{ gn += g.items.length; return `<div class="mdept"><div class="mdh">${esc(g.title)}</div>${g.items.map((it,ii)=>mPerson(it, `groups.${ci}.${gi}.items.${ii}`)).join('')}</div>`; }).join('')).join('');
  if (gn) h += mDet('grp', '파견 · 교육', gn, gh);
  if (D.footnote) h += `<div class="mfoot">${esc(D.footnote)}</div>`;
  if (D.stat) h += `<details class="mu" data-k="stat"${MV.open.has('stat')?' open':''}><summary><span>조직 현황</span></summary><div style="padding:8px"><table class="mstat"><tr>${D.stat.head.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${D.stat.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div></details>`;
  body.innerHTML = h + '<div class="mnone" id="mnone" style="display:none">검색 결과가 없습니다</div>';
  mFilter();
}
function mFilter(){
  const body = document.getElementById('mbody'), cnt = document.getElementById('mcnt');
  const q = document.getElementById('mq').value.replace(/[\s-]/g,'');
  const rows = body.querySelectorAll('.mrow'), dets = body.querySelectorAll('details.mu[data-k]');
  if (!q) {
    rows.forEach(r => r.style.display = ''); body.querySelectorAll('.mdept,.msec,.mfoot').forEach(x => x.style.display = '');
    body.querySelectorAll('details.md').forEach(d => { d.style.display = ''; d.open = MV.mdOpen.has(d.dataset.k2); });
    dets.forEach(d => { d.style.display = ''; d.open = MV.open.has(d.dataset.k) || MV.allOpen; });
    document.getElementById('mnone').style.display = 'none'; cnt.textContent = '☎ 내선 · 📞 휴대전화 · ✉ 메일 · 이름 누르면 카드'; return;
  }
  let n = 0;
  rows.forEach(r => { const ok = r.dataset.s.includes(q); r.style.display = ok ? '' : 'none'; if (ok) n++; });
  body.querySelectorAll('.mdept').forEach(x => x.style.display = x.querySelector('.mrow:not([style*="none"])') ? '' : 'none');
  body.querySelectorAll('.mfoot').forEach(x => x.style.display = 'none');
  body.querySelectorAll('details.md').forEach(d => { const has = !!d.querySelector('.mrow:not([style*="none"])'); d.style.display = has ? '' : 'none'; if (has) d.open = true; });
  dets.forEach(d => { const has = !!d.querySelector('.mrow:not([style*="none"])'); d.style.display = has ? '' : 'none'; if (has) d.open = true; });
  document.getElementById('mnone').style.display = n ? 'none' : 'block'; cnt.textContent = n + '명 검색됨';
}
(function(){
  const m = document.getElementById('m');
  m.addEventListener('click', e => {
    if (e.target.closest('a.mcall')) return;                       /* 전화 링크는 그대로 */
    const sm = e.target.closest('summary');
    if (sm) { const d = sm.parentElement;
      if (d.classList.contains('md')) { setTimeout(() => { if (document.getElementById('mq').value.trim()) return; d.open ? MV.mdOpen.add(d.dataset.k2) : MV.mdOpen.delete(d.dataset.k2); }, 0); return; }
      setTimeout(() => { if (document.getElementById('mq').value.trim()) return; d.open ? MV.open.add(d.dataset.k) : MV.open.delete(d.dataset.k); }, 0); return; }
    if (e.target.closest('.mcall')) return;
    const row = e.target.closest('.mrow'); if (row) pcOpen(row.dataset.mp);
  });
  document.getElementById('mq').addEventListener('input', mFilter);
  document.getElementById('mAll').addEventListener('click', e => {
    MV.allOpen = !MV.allOpen; document.querySelectorAll('#mbody details.mu[data-k]').forEach(d => { d.open = MV.allOpen; MV.allOpen ? MV.open.add(d.dataset.k) : MV.open.delete(d.dataset.k); });
    document.querySelectorAll('#mbody details.md').forEach(d => { d.open = MV.allOpen; MV.allOpen ? MV.mdOpen.add(d.dataset.k2) : MV.mdOpen.delete(d.dataset.k2); });
    e.target.textContent = MV.allOpen ? '모두 접기' : '모두 펼치기';
  });
  renderMobile();
})();

/* ══ 데이터 팩 불러오기: 앱에는 연락처가 없고, 이 폰에만 저장한다 ══ */
const IDB = {
  open(){ return new Promise((res,rej)=>{ const r = indexedDB.open('junggu-contacts',1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k){ const db = await this.open(); return new Promise((res,rej)=>{ const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k,v){ const db = await this.open(); return new Promise((res,rej)=>{ const t = db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  async del(k){ const db = await this.open(); return new Promise((res,rej)=>{ const t = db.transaction('kv','readwrite'); t.objectStore('kv').delete(k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
};
var impPending = null;
const $i = id => document.getElementById(id);
function impMsg(t, err){ const e = $i('impMsg'); e.textContent = t || ''; e.className = err ? 'err' : ''; }
function impShow(on){
  const g = id => document.getElementById(id);
  g('imp').style.display = on ? 'block' : 'none';
  g('mbody').style.display = on ? 'none' : '';
  g('impDel').style.display = on && D ? 'inline-block' : 'none';
  g('impClose').style.display = on && D ? 'inline-block' : 'none';
  g('impInfo').textContent = D ? '현재 저장된 데이터 기준일: ' + (D.date || '알 수 없음') : '';
  if (on) { g('impPwBox').style.display = 'none'; impPending = null; }
}
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptPack(o, pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64d(o.salt), iterations:o.iter||200000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(o.iv)}, key, b64d(o.data));
  return JSON.parse(new TextDecoder().decode(pt));
}
function rowsToD(rows){
  const txt = v => String(v == null ? '' : v).trim();
  const ok = rows.filter(r => r && txt(r.name) && !r.bad && (txt(r.status) || '재직') === '재직');
  const per = (r, label) => { const o = {name: txt(r.name), label: label != null ? label : (txt(r.duty) || txt(r.pos)), tel: txt(r.ext).replace(/\D/g,'').slice(-4)};
    if (txt(r.rank)) o.rank = txt(r.rank); if (txt(r.duty)) o.duty = txt(r.duty); if (txt(r.mob)) o.mobile = txt(r.mob); if (txt(r.mail)) o.email = txt(r.mail); if (r.photo) o.photo = r.photo; if (r.id) o.id = r.id; return o; };
  const HEADU = /(국장|실장|소장|관장|센터장|단장)$/, HEADD = /(과장|담당관|센터장|소장|팀장|동장|관장|실장)$/;
  const n = new Date();
  const D = {title:'울산 중구 연락망', date: n.getFullYear() + '. ' + (n.getMonth()+1) + '. ' + n.getDate() + '.', footnote:'', head:null, secretaries:[], deputy:null, deputySecs:[], units:[], dongs:[], groups:[], stat:null};
  const U = new Map(), DG = new Map(), etc = [];
  ok.forEach(r => {
    const pos = txt(r.pos).replace(/\s+/g,''), t = txt(r.org).split(/\s+/).filter(Boolean).map(s => s.replace(/\(.*\)$/,'')), last = t[t.length-1] || '';
    if (pos === '구청장') { D.head = per(r, '구청장'); return; }
    if (pos === '부구청장') { D.deputy = per(r, '부구청장'); return; }
    if (/부구청장$/.test(last)) { D.deputySecs.push(per(r, pos || '비서')); return; }
    if (last === '구청장' || (!t.length && /^비서/.test(pos))) { D.secretaries.push(per(r, pos || '비서')); return; }
    if (!t.length) { etc.push(r); return; }
    if (/동$/.test(t[0])) { if (!DG.has(t[0])) DG.set(t[0], {head:null, staff:[]}); const g = DG.get(t[0]); if (pos === '동장' && !g.head) g.head = per(r, t[0] + '장'); else g.staff.push(per(r)); return; }
    if (!U.has(t[0])) U.set(t[0], {bureau:null, depts:new Map(), direct:[]});
    const u = U.get(t[0]);
    if (t.length === 1) { if (HEADU.test(pos) && !u.bureau) u.bureau = r; else u.direct.push(r); return; }
    if (!u.depts.has(t[1])) u.depts.set(t[1], []);
    u.depts.get(t[1]).push(r);
  });
  const mkDept = (name, list) => { const hi = list.findIndex(r => HEADD.test(txt(r.pos).replace(/\s+/g,'')));
    const h = hi >= 0 ? per(list[hi], name + '장') : {name:'', label: name + '장', tel:''};
    h.teams = list.filter((r, i) => i !== hi).map(r => per(r)); return h; };
  U.forEach((u, name) => {
    if (!u.depts.size) { const list = (u.bureau ? [u.bureau] : []).concat(u.direct); D.units.push({bureau:null, depts:[mkDept(name, list)]}); return; }
    const bureau = u.bureau ? per(u.bureau, name + '장') : {name:'', label: name + '장', tel:''};
    const depts = [...u.depts].map(([dn, list]) => mkDept(dn, list));
    if (u.direct.length) depts.push({nobox:true, label:'직속', teams:u.direct.map(r => per(r))});
    D.units.push({bureau, depts});
  });
  DG.forEach((g, name) => { const h = g.head || {name:'', label: name + '장', tel:''}; h.staff = g.staff; D.dongs.push(h); });
  if (etc.length) D.units.push({bureau:null, depts:[{nobox:true, label:'소속 미지정', teams:etc.map(r => per(r))}]});
  return D;
}
async function applyPack(x){
  if (x && !x.units && Array.isArray(x.rows)) x = rowsToD(x.rows);
  if (!x || !Array.isArray(x.units)) throw new Error('연락망 데이터 파일이 아니에요.');
  delete x.lines; delete x.slogan; delete x.sloganImg; (x.units||[]).forEach(u => delete u.row);
  let saved = true;
  try { await IDB.set('D', x); } catch(e) { saved = false; }
  D = x; normalize(); MV.open.clear(); MV.mdOpen.clear(); MV.allOpen = false;
  renderMobile(); impShow(false);
  if (!saved) alert('이 브라우저에서는 저장할 수 없어요. 앱을 닫으면 데이터가 사라질 수 있어요.');
}
$i('impFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  impMsg('읽는 중...');
  try {
    const o = JSON.parse(await f.text());
    if (o && o.enc) { impPending = o; $i('impPwBox').style.display = 'block'; impMsg('비밀번호를 입력하세요.'); $i('impPw').focus(); return; }
    await applyPack(o); impMsg('');
  } catch(err) { impMsg('불러올 수 없어요: ' + (err.message || '올바른 파일이 아니에요.'), true); }
});
$i('impPwGo').addEventListener('click', async () => {
  if (!impPending) return;
  try { const x = await decryptPack(impPending, $i('impPw').value); $i('impPw').value = ''; await applyPack(x); impMsg(''); }
  catch(err) { impMsg('비밀번호가 맞지 않거나 파일이 손상됐어요.', true); }
});
$i('impDel').addEventListener('click', async () => {
  if (!confirm('이 폰에 저장된 연락처 데이터를 삭제할까요?')) return;
  try { await IDB.del('D'); } catch(e) {}
  D = null; renderMobile();
});
$i('impClose').addEventListener('click', () => impShow(false));
$i('mData').addEventListener('click', () => impShow($i('imp').style.display === 'none'));
(async () => {
  try { const x = await IDB.get('D'); if (x) { D = x; normalize(); renderMobile(); impShow(false); } } catch(e) {}
})();
</script>
